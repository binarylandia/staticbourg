# OpenSSL target of MinGW on arm64 (aarch64-w64-mingw32), which OpenSSL 3.5
# lacks: the settings of mingw64 for a 64-bit Windows target (LLP64), with the C
# implementations instead of assembly, because the arm64 assembly of OpenSSL has
# no MinGW flavor.
my %targets = (
    "mingwarm64" => {
        inherit_from     => [ "mingw-common" ],
        sys_id           => "MINGWARM64",
        bn_ops           => add("SIXTY_FOUR_BIT"),
        asm_arch         => undef,
        uplink_arch      => undef,
        perlasm_scheme   => undef,
        multilib         => "64",
    },
);
